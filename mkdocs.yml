# MkDocs configuration for attributedict
site_name: attributedict
site_description: >-
  A production-quality CPython C extension implementing an AttributeDict —
  dict semantics with attribute access (d["host"] == d.host).
site_url: https://OWNER.github.io/attributedict/
repo_url: https://github.com/OWNER/attributedict
repo_name: OWNER/attributedict
edit_uri: ""

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/logo.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - content.code.copy

extra_css:
  - assets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed
  - toc:
      permalink: true

nav:
  - Home: index.md
  - User Guide:
      - Installation: installation.md
      - Quickstart: quickstart.md
      - API Reference: api.md
      - Attribute Semantics: attribute-semantics.md
      - Mapping Semantics: mapping-semantics.md
      - Nested Conversion: nested.md
      - Serialization: serialization.md
      - Errors: errors.md
      - FAQ: faq.md
      - Troubleshooting: troubleshooting.md
  - Developer Guide:
      - Architecture: architecture.md
      - Development: development.md
      - Benchmarks: benchmarks.md
      - Performance: performance.md
      - Packaging: packaging.md
      - Release: release.md
      - Compatibility: compatibility.md
      - Audit: audit.md
