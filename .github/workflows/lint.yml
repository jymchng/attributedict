# I-017: lint/typecheck workflow (NFR-009, SEC-004).

name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff mypy

      - name: ruff check
        run: ruff check src tests

      - name: ruff format
        run: ruff format --check src tests

      - name: mypy
        run: mypy src
