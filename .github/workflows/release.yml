# I-017/I-023: release workflow (PKG-008, SEC-006).
#
# Manual-trigger (workflow_dispatch with a tag) or tag push (v*). Builds the
# sdist + the full abi3 wheel matrix, validates them, creates a GitHub
# Release with the artifacts, and publishes to PyPI via TRUSTED PUBLISHING
# (OIDC) as "py-attributedict" — no credentials/tokens are stored in the repo.
#
# The package version is derived from the git tag by setuptools-scm
# (dynamic versioning, D-005): tag v0.1.0 -> version 0.1.0.
#
# Trusted publishing setup (maintainer, one-time, on PyPI):
#   1. Register the project "py-attributedict" on PyPI (and/or TestPyPI).
#   2. Add a "publishing source": GitHub Actions, owner jymchng, repo
#      attributedict, workflow "release.yml", environment "release".
#   3. The publish job below then authenticates via OIDC with no secrets.

name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to release (e.g. v0.1.0)"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write  # GitHub Release (SEC-004: scoped)
  id-token: write  # OIDC for PyPI trusted publishing

jobs:
  build_sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist --outdir dist

      - name: Verify sdist version (setuptools-scm)
        run: |
          python - <<'EOF'
          import glob, tarfile, re
          sd = glob.glob("dist/*.tar.gz")[0]
          print(f"sdist: {sd}")
          with tarfile.open(sd) as t:
              names = t.getnames()
          m = re.search(r"py_attributedict-([^/]+)/", names[0])
          assert m, names[:5]
          print(f"version from tag: {m.group(1)}")
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist/*.tar.gz

  build_wheels:
    name: Build wheel (${{ matrix.os }} ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-latest
            arch: aarch64
          - os: ubuntu-latest
            arch: i686
          - os: ubuntu-latest
            arch: ppc64le
          - os: ubuntu-latest
            arch: s390x
          - os: ubuntu-latest
            arch: armv7l
          - os: macos-latest
            arch: arm64
          - os: macos-latest
            arch: x86_64
          - os: windows-latest
            arch: AMD64
          - os: windows-latest
            arch: ARM64
          - os: windows-latest
            arch: x86
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          fetch-tags: true

      - name: Set up QEMU (cross-arch Linux builds)
        if: runner.os == 'Linux' && matrix.arch != 'x86_64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
        with:
          output-dir: dist

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*.whl

  github_release:
    name: Create GitHub Release
    needs: [build_sdist, build_wheels]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: 'dist-*'
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: 'wheels-*'
          merge-multiple: true
          path: dist

      - name: Verify artifact integrity (SEC-006) + count
        run: |
          python - <<'EOF'
          import hashlib, glob
          files = sorted(glob.glob("dist/*"))
          assert files, "no artifacts"
          for f in files:
              h = hashlib.sha256(open(f, "rb").read()).hexdigest()
              print(f"{f}: {h}")
          print(f"total artifacts: {len(files)}")
          assert any(f.endswith(".tar.gz") for f in files), "missing sdist"
          whls = [f for f in files if f.endswith(".whl")]
          assert len(whls) >= 8, f"expected many wheels, got {len(whls)}"
          EOF

      - uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/*
          draft: true
          generate_release_notes: true

  publish:
    # Publish to PyPI ("py-attributedict") via trusted publishing (OIDC).
    needs: [build_sdist, build_wheels]
    runs-on: ubuntu-latest
    environment:
      name: release
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: 'dist-*'
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: 'wheels-*'
          merge-multiple: true
          path: dist

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          packages-dir: dist
