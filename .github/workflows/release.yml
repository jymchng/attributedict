# I-017/I-023: release workflow (PKG-008, SEC-006).
#
# Manual-trigger (workflow_dispatch with a tag) or tag push (v*). Builds the
# sdist + the full abi3 wheel matrix, validates them, creates a GitHub
# Release with the artifacts, and publishes to PyPI via TRUSTED PUBLISHING
# (OIDC) as "py-attributedict" — no credentials/tokens are stored in the repo.
#
# The package version is derived from the git tag by setuptools-scm
# (dynamic versioning, D-005): tag v0.1.0 -> version 0.1.0.
#
# Trusted publishing setup (maintainer, one-time, on PyPI):
#   1. Register the project "py-attributedict" on PyPI (and/or TestPyPI).
#   2. Add a "publishing source": GitHub Actions, owner OWNER, repo
#      attributedict, workflow "release.yml", environment "release".
#   3. The publish job below then authenticates via OIDC with no secrets.

name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to release (e.g. v0.1.0)"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write  # GitHub Release (SEC-004: scoped)
  id-token: write  # OIDC for PyPI trusted publishing

jobs:
  build_sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist --outdir dist

      - name: Verify sdist version (setuptools-scm)
        run: |
          python - <<'EOF'
          import glob, tarfile, re
          sd = glob.glob("dist/*.tar.gz")[0]
          print(f"sdist: {sd}")
          with tarfile.open(sd) as t:
              names = t.getnames()
          # First entry is the sdist root dir, e.g. py_attributedict-0.2.0
          m = re.match(r"py_attributedict-([^/]+)", names[0])
          assert m, names[:5]
          print(f"version from tag: {m.group(1)}")
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist/*.tar.gz

  build_wheels:
    name: Build wheel (${{ matrix.os }} ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-latest
            arch: aarch64
          - os: ubuntu-latest
            arch: i686
          - os: ubuntu-latest
            arch: ppc64le
          - os: ubuntu-latest
            arch: s390x
          - os: ubuntu-latest
            arch: armv7l
          - os: macos-latest
            arch: arm64
          - os: macos-latest
            arch: x86_64
          - os: windows-latest
            arch: AMD64
          - os: windows-latest
            arch: ARM64
          - os: windows-latest
            arch: x86
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          fetch-tags: true

      - name: Set up QEMU (cross-arch Linux builds)
        if: runner.os == 'Linux' && matrix.arch != 'x86_64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
        with:
          output-dir: dist

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*.whl

  build_pyodide_wheel:
    name: Build pyodide wheel (wasm32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build pyodide (emscripten wasm32) wheel
        env:
          CIBW_PLATFORM: pyodide
          CIBW_BUILD: cp313-pyodide_wasm32
          # Override [tool.cibuildwheel] archs (native archs are invalid for
          # pyodide; wasm32 is the only supported arch).
          CIBW_ARCHS: wasm32
        uses: pypa/cibuildwheel@v4.2.0
        with:
          output-dir: dist
          # Pin pyodide 314.0.3 (Emscripten 5.0.3) — the version the AsyncMove
          # playground loads (jsdelivr "latest"). Without this, the wheel is
          # tagged pyemscripten_2025_0_wasm32 and micropip rejects it against
          # a 5.0.3 runtime: "Wheel was built with Emscripten vpyemscripten.2025.0
          # but Pyodide was built with Emscripten v5.0.3".
          pyodide-version: 314.0.3

      - name: Produce GitHub-only emscripten variant of the pyodide wheel
        env:
          # Real Emscripten version of the pinned pyodide xbuildenv. Used as a
          # fallback if the cache lookup below finds nothing; keep in sync with
          # pyodide-version above.
          PYODIDE_EMSCRIPTEN_VERSION: "5.0.3"
        run: |
          set -euo pipefail
          # The native pyodide-build wheel is tagged pyemscripten_2026_0_wasm32
          # (PEP 783; pyodide 314.0.3 = ABI 2026_0 / Emscripten 5.0.3). That is
          # the tag PyPI accepts AND micropip 0.11.1's sys_tags() generates, so
          # it is uploaded to PyPI for Packages-tab (install-by-name) installs.
          # For direct-URL users we ALSO ship an emscripten_5_0_3_wasm32 variant
          # as a GitHub Release asset only (PyPI rejects that tag).
          ls -1 dist/
          # Derive the Emscripten version from the xbuildenv that cibuildwheel
          # just installed (authoritative: it is the exact toolchain the wheel
          # was compiled with). Fall back to the env var above.
          # NOTE: keep '*314.0.3*' in sync with pyodide-version above.
          MKFILE=$(find "$HOME/.cache/cibuildwheel" -type f -name Makefile.envs \
            -path '*pyodide-build-*' -path '*314.0.3*' \
            -path '*/xbuildenv/pyodide-root/Makefile.envs' 2>/dev/null | head -n1 || true)
          if [ -n "$MKFILE" ]; then
            # Makefile.envs uses 'export PYODIDE_EMSCRIPTEN_VERSION ?= 5.0.3'
            # (?= means "set if not already defined"); also tolerate '='.
            PYODIDE_EMSCRIPTEN_VERSION=$(sed -n 's/^export *PYODIDE_EMSCRIPTEN_VERSION[^=]*= *//p' "$MKFILE" \
              | tr -d "\"'" | tail -n1)
          fi
          echo "Emscripten version: ${PYODIDE_EMSCRIPTEN_VERSION:-<unset>}"
          python scripts/retag_pyodide_wheel.py \
            --emscripten-version "$PYODIDE_EMSCRIPTEN_VERSION" dist/*.whl
          # Keep BOTH wheels: the pyemscripten_2026_0_wasm32 one (PyPI) and the
          # emscripten_<ver>_wasm32 one (GitHub release asset).

      - name: Verify pyodide wheel tags (pyemscripten_2026_0_wasm32 + emscripten variant)
        run: |
          python - <<'EOF'
          import glob, zipfile
          whls = [f for f in glob.glob("dist/*.whl") if "emscripten" in f or "pyemscripten" in f]
          assert len(whls) == 2, f"expected pyemscripten + emscripten wheels, got {whls}"
          pyem = [w for w in whls if "pyemscripten" in w]
          em = [w for w in whls if "pyemscripten" not in w]
          assert len(pyem) == 1 and len(em) == 1, (pyem, em)
          def tag_of(w):
              with zipfile.ZipFile(w) as z:
                  meta = [n for n in z.namelist() if n.endswith("WHEEL")][0]
                  return z.read(meta).decode()
          assert "pyemscripten_2026_0_wasm32" in tag_of(pyem[0]), tag_of(pyem[0])
          assert "emscripten_5_0_3_wasm32" in tag_of(em[0]), tag_of(em[0])
          print(f"OK pyemscripten: {pyem[0]}")
          print(f"OK emscripten:   {em[0]}")
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-pyodide
          path: dist/*emscripten*.whl

  github_release:
    name: Create GitHub Release
    needs: [build_sdist, build_wheels, build_pyodide_wheel]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: 'dist-*'
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: 'wheels-*'
          merge-multiple: true
          path: dist

      - name: Verify artifact integrity (SEC-006) + count
        run: |
          python - <<'EOF'
          import hashlib, glob
          files = sorted(glob.glob("dist/*"))
          assert files, "no artifacts"
          for f in files:
              h = hashlib.sha256(open(f, "rb").read()).hexdigest()
              print(f"{f}: {h}")
          print(f"total artifacts: {len(files)}")
          assert any(f.endswith(".tar.gz") for f in files), "missing sdist"
          whls = [f for f in files if f.endswith(".whl")]
          assert len(whls) >= 9, f"expected many wheels incl pyodide, got {len(whls)}"
          # GitHub Release must carry the emscripten_*_wasm32 variant (the
          # pyemscripten_2026_0_wasm32 wheel goes to PyPI; both are produced).
          assert any("emscripten" in f and "pyemscripten" not in f for f in whls), "missing emscripten pyodide wheel variant"
          EOF

      - uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/*
          # Published immediately (not a draft) so assets are downloadable
          # right away; re-runs on the same tag update the existing release.
          draft: false
          generate_release_notes: true

  publish:
    # Publish to PyPI ("py-attributedict") via trusted publishing (OIDC).
    needs: [build_sdist, build_wheels, build_pyodide_wheel]
    runs-on: ubuntu-latest
    environment:
      name: release
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: 'dist-*'
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: 'wheels-*'
          merge-multiple: true
          path: dist

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          packages-dir: dist
          # Re-runs of the same release tag are idempotent: files already on
          # PyPI (e.g. the 0.2.1 native wheels/sdist) are skipped while the
          # pyodide wheel gets uploaded.
          skip-existing: true
