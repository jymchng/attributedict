# I-017/I-023: release workflow (PKG-008, SEC-006).
#
# Manual-trigger (workflow_dispatch with a tag) or tag push (v*). Builds the
# sdist + the full abi3 wheel matrix, validates them, creates a GitHub
# Release with the artifacts, and publishes to PyPI via TRUSTED PUBLISHING
# (OIDC) as "py-attributedict" — no credentials/tokens are stored in the repo.
#
# The package version is derived from the git tag by setuptools-scm
# (dynamic versioning, D-005): tag v0.1.0 -> version 0.1.0.
#
# Trusted publishing setup (maintainer, one-time, on PyPI):
#   1. Register the project "py-attributedict" on PyPI (and/or TestPyPI).
#   2. Add a "publishing source": GitHub Actions, owner OWNER, repo
#      attributedict, workflow "release.yml", environment "release".
#   3. The publish job below then authenticates via OIDC with no secrets.

name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to release (e.g. v0.1.0)"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write  # GitHub Release (SEC-004: scoped)
  id-token: write  # OIDC for PyPI trusted publishing

jobs:
  build_sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist --outdir dist

      - name: Verify sdist version (setuptools-scm)
        run: |
          python - <<'EOF'
          import glob, tarfile, re
          sd = glob.glob("dist/*.tar.gz")[0]
          print(f"sdist: {sd}")
          with tarfile.open(sd) as t:
              names = t.getnames()
          # First entry is the sdist root dir, e.g. py_attributedict-0.2.0
          m = re.match(r"py_attributedict-([^/]+)", names[0])
          assert m, names[:5]
          print(f"version from tag: {m.group(1)}")
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist/*.tar.gz

  build_wheels:
    name: Build wheel (${{ matrix.os }} ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-latest
            arch: aarch64
          - os: ubuntu-latest
            arch: i686
          - os: ubuntu-latest
            arch: ppc64le
          - os: ubuntu-latest
            arch: s390x
          - os: ubuntu-latest
            arch: armv7l
          - os: macos-latest
            arch: arm64
          - os: macos-latest
            arch: x86_64
          - os: windows-latest
            arch: AMD64
          - os: windows-latest
            arch: ARM64
          - os: windows-latest
            arch: x86
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          fetch-tags: true

      - name: Set up QEMU (cross-arch Linux builds)
        if: runner.os == 'Linux' && matrix.arch != 'x86_64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
        with:
          output-dir: dist

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*.whl

  build_pyodide_wheel:
    name: Build pyodide wheel (wasm32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build pyodide (emscripten wasm32) wheel
        env:
          CIBW_PLATFORM: pyodide
          CIBW_BUILD: cp313-pyodide_wasm32
          # Override [tool.cibuildwheel] archs (native archs are invalid for
          # pyodide; wasm32 is the only supported arch).
          CIBW_ARCHS: wasm32
        uses: pypa/cibuildwheel@v4.2.0
        with:
          output-dir: dist

      - name: Re-tag pyodide wheel to pyemscripten_2026_0_wasm32 (PyPI) + emscripten_5_0_3 (GitHub)
        env:
          PYODIDE_EMSCRIPTEN_VERSION: "5.0.3"
        run: |
          set -euo pipefail
          ls -1 dist/
          # cibuildwheel 4.2.0's pyodide build tags the wheel
          # pyemscripten_2025_0_wasm32 (its default xbuildenv), but the
          # AsyncMove playground runtime (pyodide 314.0.3) reports ABI 2026_0,
          # so micropip 0.11.1 rejects 2025_0. The binary is already compiled
          # with Emscripten 5.0.3 (ABI-compatible), so we only re-tag:
          #   - the PyPI wheel  -> pyemscripten_2026_0_wasm32 (accepted by both
          #     PyPI and micropip 0.11.1 sys_tags; enables Packages-tab installs)
          #   - a GitHub asset  -> emscripten_5_0_3_wasm32 (direct-URL installs)
          python - <<'EOF'
          import zipfile, base64, hashlib, glob

          def retag(src, dst, old, new):
              with zipfile.ZipFile(src) as z:
                  entries = {n: z.read(n) for n in z.namelist()}
              wm = [n for n in entries if n.endswith("WHEEL")][0]
              rm = [n for n in entries if n.endswith("RECORD")][0]
              nw = entries[wm].decode().replace(old, new)
              with zipfile.ZipFile(dst, "w", zipfile.ZIP_DEFLATED) as z:
                  for n, data in entries.items():
                      if n == wm:
                          data = nw.encode()
                      if n == rm:
                          continue
                      z.writestr(n, data)
                  rec = []
                  for n, data in [(k, v) for k, v in entries.items() if k != rm]:
                      if n == wm:
                          data = nw.encode()
                      d = base64.urlsafe_b64encode(hashlib.sha256(data).digest()).rstrip(b"=").decode()
                      rec.append(f"{n},sha256={d},{len(data)}")
                  z.writestr(rm, ("\n".join(rec) + "\n" + f"{rm},,\n").encode())

          whls = glob.glob("dist/*.whl")
          assert len(whls) == 1, whls
          src = whls[0]
          # PyPI wheel: pyemscripten_2026_0_wasm32
          pypi = src.replace("pyemscripten_2025_0_wasm32", "pyemscripten_2026_0_wasm32")
          retag(src, pypi, "pyemscripten_2025_0_wasm32", "pyemscripten_2026_0_wasm32")
          # GitHub asset: emscripten_5_0_3_wasm32
          gh = src.replace("pyemscripten_2025_0_wasm32", "emscripten_5_0_3_wasm32")
          retag(src, gh, "pyemscripten_2025_0_wasm32", "emscripten_5_0_3_wasm32")
          # keep both; drop the untagged original
          import os
          os.remove(src)
          print("wrote:", pypi)
          print("wrote:", gh)
          EOF

      - name: Verify pyodide wheel tags (pyemscripten_2026_0_wasm32 + emscripten variant)
        run: |
          python - <<'EOF'
          import glob, zipfile
          whls = [f for f in glob.glob("dist/*.whl") if "emscripten" in f or "pyemscripten" in f]
          assert len(whls) == 2, f"expected pyemscripten + emscripten wheels, got {whls}"
          pyem = [w for w in whls if "pyemscripten" in w]
          em = [w for w in whls if "pyemscripten" not in w]
          assert len(pyem) == 1 and len(em) == 1, (pyem, em)
          def tag_of(w):
              with zipfile.ZipFile(w) as z:
                  meta = [n for n in z.namelist() if n.endswith("WHEEL")][0]
                  return z.read(meta).decode()
          assert "pyemscripten_2026_0_wasm32" in tag_of(pyem[0]), tag_of(pyem[0])
          assert "emscripten_5_0_3_wasm32" in tag_of(em[0]), tag_of(em[0])
          print(f"OK pyemscripten: {pyem[0]}")
          print(f"OK emscripten:   {em[0]}")
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-pyodide
          path: dist/*emscripten*.whl

  github_release:
    name: Create GitHub Release
    needs: [build_sdist, build_wheels, build_pyodide_wheel]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: 'dist-*'
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: 'wheels-*'
          merge-multiple: true
          path: dist

      - name: Verify artifact integrity (SEC-006) + count
        run: |
          python - <<'EOF'
          import hashlib, glob
          files = sorted(glob.glob("dist/*"))
          assert files, "no artifacts"
          for f in files:
              h = hashlib.sha256(open(f, "rb").read()).hexdigest()
              print(f"{f}: {h}")
          print(f"total artifacts: {len(files)}")
          assert any(f.endswith(".tar.gz") for f in files), "missing sdist"
          whls = [f for f in files if f.endswith(".whl")]
          assert len(whls) >= 9, f"expected many wheels incl pyodide, got {len(whls)}"
          # GitHub Release must carry the emscripten_*_wasm32 variant (the
          # pyemscripten_2026_0_wasm32 wheel goes to PyPI; both are produced).
          assert any("emscripten" in f and "pyemscripten" not in f for f in whls), "missing emscripten pyodide wheel variant"
          EOF

      - uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/*
          # Published immediately (not a draft) so assets are downloadable
          # right away; re-runs on the same tag update the existing release.
          draft: false
          generate_release_notes: true

  publish:
    # Publish to PyPI ("py-attributedict") via trusted publishing (OIDC).
    needs: [build_sdist, build_wheels, build_pyodide_wheel]
    runs-on: ubuntu-latest
    environment:
      name: release
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: 'dist-*'
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: 'wheels-*'
          merge-multiple: true
          path: dist

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          packages-dir: dist
          # Re-runs of the same release tag are idempotent: files already on
          # PyPI (e.g. the 0.2.1 native wheels/sdist) are skipped while the
          # pyodide wheel gets uploaded.
          skip-existing: true
