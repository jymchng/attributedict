# I-017/I-023: release workflow (PKG-008, SEC-006).
#
# Manual-trigger (workflow_dispatch) only. Builds sdist + abi3 wheels via
# the cibuildwheel matrix, validates them, creates a GitHub Release with the
# artifacts, and publishes to PyPI via TRUSTED PUBLISHING (OIDC) — no
# credentials/tokens are stored in the repo.
#
# Trusted publishing setup (maintainer, one-time):
#   1. Create/claim the "attributedict" project on PyPI.
#   2. Add a "publishing source": GitHub Actions, owner jymchng, repo
#      attributedict, workflow "release.yml", environment "release".
#   3. The publish job below then authenticates via OIDC with no secrets.

name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to release (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write  # GitHub Release (SEC-004: scoped)
  id-token: write  # OIDC for PyPI trusted publishing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist --outdir dist

      - name: Build abi3 wheels
        uses: pypa/cibuildwheel@v4.2.0
        with:
          output-dir: dist
        env:
          CIBW_ARCHS: x86_64 aarch64

      - name: Verify artifact integrity (SEC-006)
        run: |
          python - <<'EOF'
          import hashlib, glob
          for f in sorted(glob.glob("dist/*")):
              h = hashlib.sha256(open(f, "rb").read()).hexdigest()
              print(f"{f}: {h}")
          EOF

      - name: Upload artifacts to the release
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: ${{ inputs.tag }}
          files: dist/*
          draft: true
          generate_release_notes: true

  publish:
    # Publish to PyPI via trusted publishing (OIDC).
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          packages-dir: dist
