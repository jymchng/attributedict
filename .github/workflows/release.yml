# I-017: release workflow (PKG-008, SEC-006).
#
# Manual-trigger (workflow_dispatch) only. Builds sdist + abi3 wheels,
# validates them, and creates a GitHub Release with the artifacts.
# NO auto-publish to PyPI (C-006): publishing requires an explicitly
# configured trusted-publisher environment by the maintainer.

name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to release (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write  # needed to create the GitHub Release (SEC-004: scoped)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist --outdir dist

      - name: Build abi3 wheels
        uses: pypa/cibuildwheel@v2.19.2
        with:
          output-dir: dist
        env:
          CIBW_ARCHS: x86_64 aarch64

      - name: Verify artifact integrity (SEC-006)
        run: |
          python - <<'EOF'
          import hashlib, glob
          for f in sorted(glob.glob("dist/*")):
              h = hashlib.sha256(open(f, "rb").read()).hexdigest()
              print(f"{f}: {h}")
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: dist/*
          draft: true
          generate_release_notes: true
