# I-021: C-extension coverage (gcov) CI job (10-testing, NFR-004, SEC-004).
#
# Builds _attributedict.c with gcov instrumentation, runs the full suite,
# generates line coverage with gcov, and gates on a line-coverage threshold
# for _attributedict.c. The measured baseline is 74.29% (2026-08-15); the
# uncovered remainder is dominated by OOM/defensive error paths that are
# not practically testable (documented in docs/development.md).

name: coverage

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  c-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install setuptools wheel pytest hypothesis gcovr

      - name: Build extension with gcov (clean rebuild)
        run: |
          rm -f src/attributedict/*.so
          find . -name __pycache__ -type d -prune -exec rm -rf {} +
          CFLAGS="-O0 --coverage -fno-omit-frame-pointer" \
          LDFLAGS="--coverage" \
          python setup.py build_ext --inplace

      - name: Run test suite against instrumented build
        run: python -m pytest tests/ -q

      - name: Generate gcov line coverage
        run: |
          gcov -o build/temp.linux-x86_64-cpython-313/src/attributedict/ \
            src/attributedict/_attributedict.c

      - name: Check C line-coverage threshold (>= 70%)
        run: |
          python - <<'EOF'
          import re, pathlib
          text = pathlib.Path("_attributedict.c.gcov").read_text()
          m = re.search(r"Lines executed:([0-9.]+)% of ([0-9]+)", text)
          if not m:
              raise SystemExit("gcov summary not found")
          pct = float(m.group(1)); total = int(m.group(2))
          print(f"_attributedict.c line coverage: {pct}% of {total} lines")
          if pct < 70.0:
              raise SystemExit(f"FAIL: C line coverage {pct}% < 70% threshold")
          print("PASS: C line coverage >= 70%")
          EOF
