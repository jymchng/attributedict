# I-021/I-023: C-extension coverage (gcov) CI job (10-testing, NFR-004, SEC-004).
#
# Builds _attributedict.c with gcov instrumentation AND the test-only
# PY_ATTRIBUTEDICT_TESTING macro (so the deterministic allocation-failure
# tests in tests/test_failinject.py can run), executes the full suite,
# generates line coverage with gcov, and gates on > 90% line coverage for
# _attributedict.c. Measured: 92.34% of 209 lines (2026-08-15).
# The test-only macro is never defined in production wheels.

name: coverage

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  c-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install setuptools wheel pytest hypothesis gcovr

      - name: Build extension with gcov (clean rebuild, test macro)
        run: |
          rm -rf build
          rm -f src/attributedict/*.so
          find . -name __pycache__ -type d -prune -exec rm -rf {} +
          CFLAGS="-O0 --coverage -fno-omit-frame-pointer -DPY_ATTRIBUTEDICT_TESTING" \
          LDFLAGS="--coverage" \
          python setup.py build_ext --inplace

      - name: Run test suite against instrumented build
        run: python -m pytest tests/ -q

      - name: Generate gcov line coverage
        run: |
          gcov -o build/temp.linux-x86_64-cpython-313/src/attributedict/ \
            src/attributedict/_attributedict.c

      - name: Check C line-coverage threshold (> 90%)
        run: |
          python - <<'EOF'
          import re, pathlib
          text = pathlib.Path("_attributedict.c.gcov").read_text()
          m = re.search(r"Lines executed:([0-9.]+)% of ([0-9]+)", text)
          if not m:
              raise SystemExit("gcov summary not found")
          pct = float(m.group(1)); total = int(m.group(2))
          print(f"_attributedict.c line coverage: {pct}% of {total} lines")
          if pct <= 90.0:
              raise SystemExit(f"FAIL: C line coverage {pct}% <= 90% threshold")
          print("PASS: C line coverage > 90%")
          EOF
