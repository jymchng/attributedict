# I-017: test matrix workflow (NFR-008, SEC-004).
#
# Builds the C extension and runs pytest across CPython versions and OSes.
# Sensible matrix: full version set on ubuntu; representative versions on
# macos/windows (R-006).

name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          # Windows/macOS: representative subset to bound CI cost (R-006)
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.11"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest hypothesis

      - name: Run tests
        run: python -m pytest tests/ -v
