# I-017: cibuildwheel abi3 matrix (PKG-006, PKG-009, SEC-004).
#
# Builds cp39-abi3 wheels (one per platform/arch, covering CPython 3.9+ via
# the stable ABI) on:
#   Linux   (manylinux): x86_64, aarch64, i686, ppc64le, s390x, armv7l
#   macOS:               arm64, x86_64
#   Windows:             AMD64, ARM64, x86
# Non-x86_64 Linux archs are cross-built via QEMU (docker/setup-qemu-action).
# Uploads artifacts; validates each wheel installs + smoke.

name: wheels

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_wheels:
    name: Build wheel (${{ matrix.os }} ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-latest
            arch: aarch64
          - os: ubuntu-latest
            arch: i686
          - os: ubuntu-latest
            arch: ppc64le
          - os: ubuntu-latest
            arch: s390x
          - os: ubuntu-latest
            arch: armv7l
          - os: macos-latest
            arch: arm64
          - os: macos-latest
            arch: x86_64
          - os: windows-latest
            arch: AMD64
          - os: windows-latest
            arch: ARM64
          - os: windows-latest
            arch: x86
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up QEMU (cross-arch Linux builds)
        if: runner.os == 'Linux' && matrix.arch != 'x86_64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_ARCHS: ${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: ./wheelhouse/*.whl

  validate_wheels:
    name: Validate wheels
    needs: build_wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: ./dist

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Smoke-test each wheel (PKG-009)
        run: |
          python -m pip install --upgrade pip
          installed=0
          for whl in dist/*.whl; do
            case "$whl" in
              *linux*|*manylinux*|*musllinux*)
                ;;
              *)
                echo "SKIPPED (non-Linux, not installable on this runner): $whl"
                continue
                ;;
            esac
            python -m venv /tmp/whl-venv
            /tmp/whl-venv/bin/pip install -q "$whl"
            /tmp/whl-venv/bin/python -c "
              from attributedict import AttributeDict
              import attributedict
              d = AttributeDict(host='x', nested={'a': [1, {'b': 2}]})
              assert d.host == 'x' and d.nested.a[1].b == 2
              assert isinstance(d.nested, AttributeDict)
              assert attributedict.__version__
            "
            rm -rf /tmp/whl-venv
            installed=$((installed+1))
            echo "OK: $whl"
          done
          echo "Validated $installed Linux wheels"
          [ "$installed" -gt 0 ]
