# I-017: cibuildwheel abi3 matrix (PKG-006, PKG-009, SEC-004).
#
# Builds cp39-abi3 wheels (one per platform/arch, covering CPython 3.9+ via
# the stable ABI) on:
#   Linux   (manylinux): x86_64, aarch64, i686, ppc64le, s390x, armv7l
#   macOS:               arm64, x86_64
#   Windows:             AMD64, ARM64, x86
# Non-x86_64 Linux archs are cross-built via QEMU (docker/setup-qemu-action).
# Uploads artifacts; validates each wheel installs + smoke.

name: wheels

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_wheels:
    name: Build wheel (${{ matrix.os }} ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-latest
            arch: aarch64
          - os: ubuntu-latest
            arch: i686
          - os: ubuntu-latest
            arch: ppc64le
          - os: ubuntu-latest
            arch: s390x
          - os: ubuntu-latest
            arch: armv7l
          - os: macos-latest
            arch: arm64
          - os: macos-latest
            arch: x86_64
          - os: windows-latest
            arch: AMD64
          - os: windows-latest
            arch: ARM64
          - os: windows-latest
            arch: x86
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up QEMU (cross-arch Linux builds)
        if: runner.os == 'Linux' && matrix.arch != 'x86_64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_ARCHS: ${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: ./wheelhouse/*.whl

  validate_wheels:
    name: Validate wheels
    needs: build_wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: ./dist

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Smoke-test each wheel (PKG-009)
        run: |
          python -m pip install --upgrade pip
          python - <<'EOF'
          import subprocess, sys
          from pathlib import Path

          installed = 0
          skipped = []
          for whl in sorted(Path("dist").glob("*.whl")):
              # platform tag is everything after the abi3 tag, e.g.
              # py_attributedict-0.1.0-cp39-abi3-manylinux_2_17_x86_64.whl
              plat = whl.name.split("-")[-1].removesuffix(".whl")
              # The validate runner is ubuntu-latest: only Linux wheels can
              # be installed here. macOS/Windows wheels are validated by
              # cibuildwheel's build itself + this same job on merge.
              if not (plat.startswith("linux") or plat.startswith("manylinux")
                      or plat.startswith("musllinux")):
                  skipped.append(whl.name)
                  continue
              subprocess.run([sys.executable, "-m", "venv", "/tmp/whl-venv"], check=True)
              subprocess.run(["/tmp/whl-venv/bin/pip", "install", "-q", str(whl)], check=True)
              subprocess.run([
                  "/tmp/whl-venv/bin/python", "-c",
                  "from attributedict import AttributeDict; import attributedict;"
                  "d = AttributeDict(host='x', nested={'a': [1, {'b': 2}]});"
                  "assert d.host == 'x' and d.nested.a[1].b == 2;"
                  "assert isinstance(d.nested, AttributeDict);"
                  "assert attributedict.__version__",
              ], check=True)
              subprocess.run(["rm", "-rf", "/tmp/whl-venv"], check=True)
              installed += 1
              print(f"OK: {whl.name}")
          print(f"Validated {installed} Linux wheels")
          for name in skipped:
              print(f"SKIPPED (platform not installable on ubuntu runner): {name}")
          assert installed > 0, "no Linux wheels to validate"
          EOF
