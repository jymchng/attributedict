[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "attributedict"
version = "0.1.0"
description = "AttributeDict: a CPython C extension dict subclass with attribute access (d['host'] == d.host)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Jim Chng", email = "jimchng@hotmail.com" }]
keywords = ["attributedict", "dict", "attribute", "mapping", "c-extension"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: C",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# C-004: no third-party runtime dependencies.
dependencies = []

[project.urls]
Repository = "https://github.com/jymchng/attributedict"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["attributedict"]

[tool.setuptools.package-data]
attributedict = ["py.typed"]

# --- Development tooling (config only; tooling itself lands in I-016) ---

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

# --- Dev tooling (I-016, NFR-009) ---

[tool.ruff]
line-length = 88
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["UP006", "UP007"]  # keep py39-compatible typing style

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
# typing limitations for the dynamic attribute access are documented (DOC-002)
files = ["src/attributedict"]
exclude = ["src/attributedict/_attributedict.c"]

[[tool.mypy.overrides]]
module = "attributedict._attributedict"
ignore_missing_imports = true

[tool.coverage.run]
source = ["attributedict"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true

# --- cibuildwheel (I-015, PKG-006): abi3 wheels per platform ---
# Build with CPython 3.9; setup.py tags the produced wheel cp39-abi3, which
# is compatible with CPython 3.9+ (one wheel per platform). cibuildwheel 4.x
# does not accept "abi3" as part of a build selector (identifiers are
# <cpXY>-<platform>), so target cp39-* directly.
[tool.cibuildwheel]
build = "cp39-*"
archs = ["x86_64", "aarch64", "arm64", "auto64"]

[tool.cibuildwheel.macos]
archs = ["arm64", "x86_64"]

[tool.cibuildwheel.linux]
archs = ["x86_64", "aarch64"]

[tool.cibuildwheel.windows]
archs = ["x86_64"]
